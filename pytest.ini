[pytest]
testpaths = tests
# -ra surfaces skip reasons, which matter here: several tests skip when the
# data pipeline hasn't been run, and a silent skip looks like a pass.
addopts = -ra --strict-markers
filterwarnings =
    # Starlette's TestClient warns about httpx on every import; it is not
    # actionable from this repository.
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
